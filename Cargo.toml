[package]
authors = ["execRooted"]
categories = ["command-line-utilities", "filesystem"]
description = "hop view — a smarter ls command for your terminal"
edition = "2024"
homepage = "https://github.com/execRooted/hview"
keywords = ["cli", "filesystem", "shell", "tool", "ls"]
license = "MIT"
name = "hview"
readme = "README.md"
repository = "https://github.com/execRooted/hview"
rust-version = "1.88.0"
version = "1.3.0"

exclude = [
    "target/",
    ".git/",
    "*.orig",
    "*.bk",
    "*.old",
    "*.bak",
    "*.swp",
    "*.swo",
    "*~",
    ".#*",
    ".env*",
    "*.d",
    "*.pdb",
    "*.so",
    "*.dylib",
    "*.a",
    "*.lib",
    "*.o",
    "*.rlib",
    "*.exe",
    "*.dll",
    "debug/",
    "release/",
    "tests/output/",
    "tmp/",
    "temp/",
    "coverage/",
    "*.profraw",
    "*.profdata",
]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
anyhow = "1.0.32"
askama = { version = "0.16.0", default-features = false, features = [
    "derive",
    "std",
] }
bincode = "1.3.1"
clap = { version = "4.3.0", features = ["derive"] }
color-print = "0.3.4"
dirs = "6.0.0"
dunce = "1.0.1"
fastrand = "2.0.0"
glob = "0.3.0"
ouroboros = "0.18.3"
serde = { version = "1.0.116", features = ["derive"] }
time = { version = "0.3.47", default-features = false, features = ["parsing", "macros", "std"] }

[target.'cfg(windows)'.dependencies]
which = "8.0.2"

[build-dependencies]
clap = { version = "4.3.0", features = ["derive"] }
clap_complete = "4.5.50"
clap_complete_fig = "4.5.2"
clap_complete_nushell = "4.5.5"
color-print = "0.3.4"

[dev-dependencies]
assert_cmd = "2.0.0"
rstest = { version = "0.26.0", default-features = false }
rstest_reuse = "0.7.0"
tempfile = "3.15.0"

[features]
default = []
nix-dev = []

[profile.release]
codegen-units = 1
debug = 0
lto = true
strip = true

[package.metadata.deb]
assets = [
    [
        "target/release/hview",
        "usr/bin/",
        "755",
    ],
    [
        "contrib/completions/hview.bash",
        "usr/share/bash-completion/completions/hview",
        "644",
    ],
    [
        "contrib/completions/hview.fish",
        "usr/share/fish/vendor_completions.d/",
        "664",
    ],
    [
        "contrib/completions/_hview",
        "usr/share/zsh/vendor-completions/",
        "644",
    ],
    [
        "man/man1/*",
        "usr/share/man/man1/",
        "644",
    ],
    [
        "README.md",
        "usr/share/doc/hview/",
        "644",
    ],
    [
        "CHANGELOG.md",
        "usr/share/doc/hview/",
        "644",
    ],
    [
        "LICENSE",
        "usr/share/doc/hview/",
        "644",
    ],
]
extended-description = """\
hview (hop view) is a smarter ls command, inspired by z and autojump. It remembers which \
directories you use most frequently, so you can "jump" to them in just a few \
keystrokes."""
priority = "optional"
section = "utils"
